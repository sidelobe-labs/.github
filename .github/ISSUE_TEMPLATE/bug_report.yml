name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail for someone else to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, app version, OS, device or other relevant environment details.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots or other evidence. Remove secrets and private data first.
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not a security vulnerability. Security issues should be reported privately according to SECURITY.md.
          required: true
